[project]
name = "tlm-client"
version = "0.1.0"
description = "Unified Ollama client for AI Test Toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.3.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
tlm-client = { path = ".", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["tlm_client"]
