[project]
name = "prompt-templates"
version = "0.1.0"
description = "Shared prompt templates for AI Test Toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
prompt-templates = { path = ".", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["prompt_templates"]
